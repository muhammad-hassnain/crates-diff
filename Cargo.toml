[package]
name = "crates_diff"
version = "0.1.0"
edition = "2021"
description = "Browse full-source diffs between any two versions of a Rust crate, with notes, content search, and GitHub history. No semver restriction."
license = "MIT"

[[bin]]
name = "crates_diff"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
flate2 = "1"
tar = "0.4"
similar = "2"
tiny_http = "0.12"
semver = "1"

[profile.release]
opt-level = 2
